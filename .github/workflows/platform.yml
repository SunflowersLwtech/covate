name: Platform

# The Next.js site in platform/. Not a deploy: covate.org ships by `vercel deploy
# --prebuilt` from a local build. This is the gate that build has to pass anyway —
# locale parity, the CJK hardcode red line, key resolution, typecheck, build,
# the rendered-language gate, and the header on phone widths in Chromium and WebKit.
on:
  push:
    branches: [main]
    paths: ["platform/**", ".github/workflows/platform.yml"]
  pull_request:
    branches: [main]
    paths: ["platform/**", ".github/workflows/platform.yml"]

concurrency:
  group: covate-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: i18n red lines (locale parity, CJK hardcode, key resolution)
        run: npm run i18n:check
      - name: Proxy unit tests (locale rewrite / redirect)
        run: npm run test:proxy
      - name: Ingest unit tests (the end-to-end part runs in sync-e2e.yml)
        run: npm run test:ingest
      - name: Ops surface unit tests (the Postgres part runs in sync-e2e.yml)
        run: npm run test:ops
      - name: Build (prerenders every page in every locale)
        run: npx next build
      - name: Image optimizer stays off (/_next/image must not come back)
        run: node scripts/check-image-optimizer-off.mjs
      - name: Language gate (Chinese pages are Chinese, English pages English, icons are ours)
        run: node scripts/zh-coverage.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Browsers for the header test
        run: npx playwright install --with-deps chromium webkit
      - name: Phone-width header (one row, no wrapped links, every link reachable)
        run: npm run test:header
