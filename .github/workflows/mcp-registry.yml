name: Publish to MCP Registry

# Run by hand on a release tag, once the image workflow has pushed that tag's
# image: gh workflow run mcp-registry.yml --ref v<version>. The registry fetches
# the image named in server.json and refuses the entry if it is missing or its
# io.modelcontextprotocol.server.name label differs, so publishing before the
# image is up fails without publishing anything.
#
# It signs in with this run's GitHub OIDC token, which the registry accepts for
# io.github.<repository owner>/*, so no token is stored as a secret.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  MCP_PUBLISHER_VERSION: v1.8.5
  MCP_PUBLISHER_SHA256: 2d151ac57275c9a6684d9d22b1cba81058bab195ea0a162e8fce3c6a5ec32812

jobs:
  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the tag, server.json and the image tag agree
        run: |
          version="$(jq -r .version server.json)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "server.json says $version, tag is $GITHUB_REF_NAME"; exit 1; }
          test "$(jq -r '.packages[0].identifier' server.json)" = "ghcr.io/sunflowerslwtech/covate:$version"

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
